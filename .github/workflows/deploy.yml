name: Deploy to Production

# Only run on pushes to main branch (after PR merge)
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy and Cache Warm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            echo "=== Deploying to production ==="

            # Navigate to web root
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull latest code
            echo "Pulling latest code from main..."
            git fetch origin
            git reset --hard origin/main

            # Update Composer dependencies
            echo "Updating Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            # Clear Kirby cache
            echo "Clearing Kirby cache..."
            rm -rf site/cache/*
            echo "✓ Kirby cache cleared"

      - name: Clear nginx cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            echo "=== Clearing nginx cache ==="

            # Clear nginx cache (adjust path based on your nginx config)
            if [ -d "/var/cache/nginx" ]; then
              sudo rm -rf /var/cache/nginx/*
              echo "✓ nginx cache cleared"
            else
              echo "⚠ nginx cache directory not found, skipping"
            fi

            # Reload nginx to apply changes
            if command -v nginx &> /dev/null; then
              sudo nginx -s reload
              echo "✓ nginx reloaded"
            fi

      - name: Purge Cloudflare cache
        run: |
          echo "=== Purging Cloudflare cache ==="

          # Purge entire zone cache
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          # Check if successful
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✓ Cloudflare cache purged successfully"
          else
            echo "✗ Cloudflare cache purge failed"
            echo "$RESPONSE"
            exit 1
          fi

      - name: Wait for caches to clear
        run: |
          echo "Waiting 10 seconds for caches to clear..."
          sleep 10

      - name: Warm cache from sitemap
        run: |
          echo "=== Warming cache from sitemap ==="

          # Fetch sitemap
          SITEMAP_URL="https://${{ secrets.DEPLOY_DOMAIN }}/sitemap.xml"
          echo "Fetching sitemap from $SITEMAP_URL"

          curl -sf "$SITEMAP_URL" -o sitemap.xml

          # Extract URLs from sitemap
          URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml)
          URL_COUNT=$(echo "$URLS" | wc -l)

          echo "Found $URL_COUNT URLs to warm"
          echo ""

          # Warm each URL
          SUCCESS=0
          FAILED=0

          while IFS= read -r url; do
            echo "Warming: $url"

            if curl -sf -o /dev/null -w "%{http_code}" "$url" | grep -q "^2"; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAILED=$((FAILED + 1))
              echo "  ✗ Failed to warm $url"
            fi

            # Small delay to avoid overwhelming server
            sleep 0.5
          done <<< "$URLS"

          echo ""
          echo "=== Cache warming complete ==="
          echo "✓ Successfully warmed: $SUCCESS URLs"
          if [ $FAILED -gt 0 ]; then
            echo "✗ Failed to warm: $FAILED URLs"
          fi

          # Create summary
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Code deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Kirby cache cleared" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ nginx cache cleared" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Cloudflare cache purged" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Cache warmed: $SUCCESS/$URL_COUNT URLs" >> $GITHUB_STEP_SUMMARY

          if [ $FAILED -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠ Warning: $FAILED URLs failed to warm" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload sitemap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-sitemap
          path: sitemap.xml
          retention-days: 7
